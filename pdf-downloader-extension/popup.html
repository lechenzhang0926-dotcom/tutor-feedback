<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 批量下载器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 420px;
    min-height: 300px;
    max-height: 560px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    background: #f8f9fa;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- Header ---- */
  .header {
    background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .header .logo {
    font-size: 22px;
    line-height: 1;
  }
  .header h1 {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
  }
  .header .badge {
    background: rgba(255,255,255,0.25);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    min-width: 28px;
    text-align: center;
  }

  /* ---- Toolbar ---- */
  .toolbar {
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    background: #fff;
    border-bottom: 1px solid #e9ecef;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar .search-box {
    flex: 1;
    min-width: 140px;
    padding: 6px 10px;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .toolbar .search-box:focus {
    border-color: #e74c3c;
    box-shadow: 0 0 0 2px rgba(231,76,60,0.12);
  }
  .btn {
    padding: 6px 10px;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    background: #fff;
    color: #495057;
    white-space: nowrap;
    transition: all 0.12s;
  }
  .btn:hover { background: #f1f3f5; border-color: #adb5bd; }
  .btn.active { background: #e74c3c; color: #fff; border-color: #e74c3c; }

  /* ---- List ---- */
  .list-container {
    flex: 1;
    overflow-y: auto;
    background: #fff;
  }
  .list-container::-webkit-scrollbar { width: 5px; }
  .list-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: #adb5bd;
    text-align: center;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
  .empty-state .msg { font-size: 13px; margin-bottom: 4px; }
  .empty-state .hint { font-size: 11px; color: #ced4da; }

  .pdf-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid #f1f3f5;
    cursor: pointer;
    transition: background 0.1s;
  }
  .pdf-item:hover { background: #fafafa; }
  .pdf-item.selected { background: #fff5f5; }

  .pdf-item input[type="checkbox"] {
    margin-top: 2px;
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    accent-color: #e74c3c;
    cursor: pointer;
  }

  .pdf-item .info {
    flex: 1;
    min-width: 0;
  }
  .pdf-item .filename {
    font-weight: 500;
    font-size: 12px;
    color: #212529;
    word-break: break-all;
    line-height: 1.4;
    margin-bottom: 2px;
  }
  .pdf-item .url-preview {
    font-size: 10px;
    color: #adb5bd;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .pdf-item .meta {
    font-size: 10px;
    color: #868e96;
    margin-top: 2px;
  }
  .pdf-item .open-link {
    flex-shrink: 0;
    color: #adb5bd;
    text-decoration: none;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    transition: all 0.12s;
  }
  .pdf-item .open-link:hover { color: #e74c3c; background: #fff5f5; }

  /* ---- Footer ---- */
  .footer {
    padding: 10px 14px;
    background: #fff;
    border-top: 1px solid #e9ecef;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn-download {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: #e74c3c;
    color: #fff;
    transition: all 0.15s;
  }
  .btn-download:hover { background: #c0392b; }
  .btn-download:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-outline {
    padding: 10px 14px;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    background: #fff;
    color: #495057;
    transition: all 0.12s;
  }
  .btn-outline:hover { background: #f1f3f5; }

  /* ---- Progress ---- */
  .progress-bar {
    height: 3px;
    background: #e9ecef;
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%;
    background: #e74c3c;
    border-radius: 2px;
    transition: width 0.3s;
  }

  /* ---- Toast ---- */
  .toast {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: #212529;
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 100;
    pointer-events: none;
    animation: toastIn 0.25s ease, toastOut 0.25s ease 2s forwards;
  }
  @keyframes toastIn  { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <span class="logo">📄</span>
  <h1>PDF 批量下载器</h1>
  <span class="badge" id="countBadge">0</span>
</div>

<div class="toolbar">
  <input type="text" class="search-box" id="searchInput" placeholder="搜索文件名或URL…" />
  <button class="btn" id="btnSelectAll">全选</button>
  <button class="btn" id="btnInvert">反选</button>
  <button class="btn" id="btnRefresh" title="重新扫描">🔄</button>
</div>

<div class="list-container" id="listContainer">
  <div class="empty-state" id="emptyState">
    <div class="icon">🔍</div>
    <div class="msg">点击"扫描页面"查找 PDF 链接</div>
    <div class="hint">支持 &lt;a&gt;、&lt;embed&gt;、&lt;iframe&gt; 标签</div>
  </div>
</div>

<div class="footer">
  <button class="btn-outline" id="btnScan" title="扫描当前页面中的PDF">🔍 扫描页面</button>
  <button class="btn-download" id="btnDownload" disabled>
    <span class="btn-label">⬇ 下载选中</span> (<span id="selectedCount">0</span>)
  </button>
</div>

<script src="popup.js"></script>
</body>
</html>
