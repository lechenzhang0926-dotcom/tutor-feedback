<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor 课后反馈助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 380px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; color: #333; background: #faf8f5; padding: 16px; }
  h2 { font-size: 15px; margin-bottom: 4px; color: #6b5e53; }
  .sub { font-size: 11px; color: #999; margin-bottom: 12px; }
  .info { background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #e8e3dc; }
  .info .label { font-size: 10px; color: #999; text-transform: uppercase; }
  .info .value { font-size: 12px; word-break: break-all; color: #555; margin-bottom: 6px; }
  .info .value:last-child { margin-bottom: 0; }
  .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; margin-bottom: 8px; }
  .btn-primary { background: #8b7355; color: #fff; }
  .btn-primary:hover { background: #6b5e53; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: #fff; color: #8b7355; border: 1px solid #8b7355; }
  .btn-secondary:hover { background: #f5f0e8; }
  .result { margin-top: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .badge-success { background: #e8f5e9; color: #2e7d32; }
  .badge-warn { background: #fff3e0; color: #e65100; }
  .badge-error { background: #ffebee; color: #c62828; }
  .student-card { background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; border: 1px solid #e8e3dc; }
  .student-card .name { font-weight: 600; font-size: 13px; color: #333; }
  .student-card .meta { font-size: 11px; color: #999; margin-top: 2px; }
  .student-card .actions { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  .student-card .action-tag { font-size: 10px; padding: 2px 8px; border-radius: 8px; background: #f0ebe0; color: #8b7355; }
  .summary { font-size: 12px; color: #666; margin-bottom: 8px; }
  .error { color: #c62828; font-size: 12px; padding: 8px; background: #ffebee; border-radius: 6px; margin-bottom: 8px; }
  .status { font-size: 12px; padding: 8px; border-radius: 6px; margin-bottom: 8px; }
  .status-ok { background: #e8f5e9; color: #2e7d32; }
  .status-info { background: #e3f2fd; color: #1565c0; }
</style>
</head>
<body>
<h2>Tutor 课后反馈助手</h2>
<div class="sub">智能英语系统 → Tutor 网站</div>

<div id="tabInfo" class="info">
  <div class="label">当前页面</div>
  <div class="value" id="pageTitle">—</div>
  <div class="label">URL</div>
  <div class="value" id="pageUrl">—</div>
</div>

<div id="warningArea"></div>

<button id="btnRead" class="btn btn-primary">读取当前页面</button>
<button id="btnSend" class="btn btn-primary" disabled>发送到 Tutor</button>

<div id="resultArea" class="result"></div>

<script src="popup.js"></script>
</body>
</html>
